[package]
name = "cooler"
kind = "tool"
version = "0.10.4"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/cooler"

[meta]
domain = "bio"
categories = ["Hi-C", "3d-genome", "matrix", "file-format", "genomics"]
keywords = ["cooler", "Hi-C", "cool", "mcool", "scool", "HDF5", "contact matrix", "3D genome", "Open2C"]
description = "cooler 0.10.4 command-line and Python runtime for storing, ingesting, querying, balancing, coarsening, and visualizing Hi-C contact matrices in .cool/.mcool HDF5 format."

[command]
name = "taf-cooler"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/cooler:0.10.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
name = "cooler"
type = "github"
repo = "open2c/cooler"
homepage = "https://cooler.readthedocs.io/"
repository = "https://github.com/open2c/cooler"
release_url = "https://github.com/open2c/cooler/releases/tag/v0.10.4"
downloads = "https://pypi.org/project/cooler/0.10.4/#files"
version = "0.10.4"
license = "BSD-3-Clause"
citation = "Abdennur N, Mirny LA. Cooler: scalable storage for Hi-C data and other genomically labeled arrays. Bioinformatics (2020)."
doi = "10.1093/bioinformatics/btz540"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["cooler", "python", "python3", "bgzip", "tabix", "sort", "gzip", "pigz", "bash", "grep", "sed"]
test = ["set -eu; cooler --version 2>&1 | grep -F '0.10.4' >/dev/null; python -c 'import cooler, Bio, dask, h5py, matplotlib, numpy, pandas, psutil, pysam, scipy; assert cooler.__version__ == \"0.10.4\"'; cooler --help | grep -F 'Type -h or --help after any subcommand' >/dev/null; cooler load --help | grep -F 'Create a cooler from a pre-binned matrix' >/dev/null; cooler csort --help | grep -F 'Requires Unix tools' >/dev/null; cooler digest --help | grep -F 'Generate fragment-delimited genomic bins' >/dev/null; cooler show --help | grep -F 'Display and browse a cooler in matplotlib' >/dev/null", "/opt/cooler/share/testdata/cooler_smoke.sh /tmp/taf-cooler-smoke-test"]
